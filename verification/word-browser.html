<!DOCTYPE html>

<head><base href="../"><script>window.__spoken=[];Object.defineProperty(window,'speechSynthesis',{value:{cancel(){},speak(u){window.__spoken.push(u)},getVoices(){return []}}});window.SpeechSynthesisUtterance=class{constructor(t){this.text=t}};</script>
<meta charset="utf-8">

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #8ecff2; overflow: hidden; }
  a { color: #2f6fd0; } a:hover { color: #1546a0; }
  /* The lesson has no text-entry fields: suppress selection and browsing carets. */
  * { -webkit-tap-highlight-color: transparent; caret-color: transparent; -webkit-user-select: none; user-select: none; }
  body { cursor: default; }
  @keyframes magicReveal {
    0% { opacity:0; transform:scale(.86) translateY(12px); filter:blur(7px) drop-shadow(0 0 18px #ffc65a); }
    58% { opacity:1; transform:scale(1.025) translateY(-2px); filter:blur(0) drop-shadow(0 0 9px rgba(255,180,55,.6)); }
    100% { opacity:1; transform:scale(1); filter:none; }
  }
  @keyframes magicSpark {
    0% { opacity:0; transform:translate(0,0) scale(.1) rotate(0deg); }
    30% { opacity:.9; }
    100% { opacity:0; transform:translate(var(--mx),var(--my)) scale(.25) rotate(100deg); }
  }
  @media (prefers-reduced-motion:reduce) { .magic-spark { display:none; } }
  @keyframes confettiFall {
    0% { transform:translate3d(0,0,0) rotate(0deg) rotateY(0deg); opacity:0; }
    10% { opacity:1; }
    75% { opacity:1; }
    100% { transform:translate3d(var(--drift),806px,0) rotate(var(--spin)) rotateY(540deg); opacity:0; }
  }
  @media (prefers-reduced-motion:reduce) { .celebration-piece { animation:none !important; display:none; } }
  @keyframes shapeFinish {
    0% { stroke:#74e8ff; fill:rgba(75,210,245,.02); filter:drop-shadow(0 0 16px rgba(34,184,230,.65)); }
    45% { stroke:#2cbce7; fill:rgba(75,210,245,.12); filter:drop-shadow(0 0 12px rgba(34,184,230,.45)); }
    100% { stroke:#1aa7d5; fill:rgba(75,210,245,.045); filter:drop-shadow(0 0 7px rgba(34,184,230,.28)); }
  }
  @media (prefers-reduced-motion:reduce) { .created-shape { animation:none !important; } }
  @keyframes dr { to { stroke-dashoffset: 0; } }
  @keyframes breathe { 0%,100% { transform: scale(1) translateY(0); } 50% { transform: scale(1.014) translateY(-3px); } }
  @keyframes sway { 0%,100% { transform: rotate(-1.1deg) translateY(0); } 50% { transform: rotate(1.4deg) translateY(-4px); } }
  @keyframes nod { 0% { transform: translateY(0) scale(1); } 35% { transform: translateY(-16px) scale(1.04); } 60% { transform: translateY(2px) scale(0.99); } 100% { transform: translateY(0); } }
  @keyframes tilt { 0%,100% { transform: rotate(0); } 30% { transform: rotate(-7deg); } 70% { transform: rotate(4deg); } }
  @keyframes wig { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-11px); } 45% { transform: translateX(9px); } 70% { transform: translateX(-6px); } }
  @keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.09); } 100% { transform: scale(1); } }
  @keyframes ptPulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.18); opacity: 0.86; } }
  @keyframes halo { 0% { transform: scale(0.7); opacity: 0.55; } 100% { transform: scale(2.1); opacity: 0; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes handHint { 0%,100% { transform: translate(0,0); opacity: 0.9; } 50% { transform: translate(64px,-52px); opacity: 1; } }
  @keyframes nudgeTap { 0% { transform: translate(14px,30px) scale(1.1); opacity: 0; } 16% { transform: translate(0,0) scale(1.06); opacity: 1; } 38% { transform: translate(0,0) scale(0.84); } 56% { transform: translate(0,0) scale(1.04); } 82% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(0,6px) scale(1); opacity: 0; } }
  @keyframes nudgeRing { 0% { transform: scale(0.3); opacity: 0; } 34% { transform: scale(0.4); opacity: 0.85; } 100% { transform: scale(1.7); opacity: 0; } }
  @keyframes glowPulse { 0%,100% { opacity: 0.25; } 50% { opacity: 0.75; } }
  /* --- MammothGuide poses. Every keyframe animates transform only, inside a
         fixed-size viewport, so the character's anchor and scale never move. --- */
  @keyframes mamRise { 0% { transform: translateY(232px); } 72% { transform: translateY(-6px); } 100% { transform: translateY(0); } }
  @keyframes mamBreathe { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-2px) scale(1.006); } }
  @keyframes mamTalk { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes mamWatch { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-2px) scale(1.004); } }
  @keyframes mamCurious { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes mamThink { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-2px) scale(1.005); } }
  @keyframes mamNod { 0% { transform: translateY(0); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0); } }
  @keyframes mamSuccessA { 0% { transform: translateY(0) scale(1); } 40% { transform: translateY(-16px) scale(1.02); } 100% { transform: translateY(0); } }
  @keyframes mamSuccessB { 0% { transform: translateY(0) scale(1); } 40% { transform: translateY(-16px) scale(1.02); } 100% { transform: translateY(0); } }
  @keyframes mamCelebrate { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-14px) scale(1.015); } }
  @keyframes mamSurpriseA { 0% { transform: scale(1); } 35% { transform: translateY(-8px) scale(1.035); } 100% { transform: translateY(0); } }
  @keyframes mamSurpriseB { 0% { transform: scale(1); } 35% { transform: translateY(-8px) scale(1.035); } 100% { transform: translateY(0); } }
  @keyframes mamOopsA { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(6px) scale(0.99); } }
  @keyframes mamOopsB { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(6px) scale(0.99); } }
  /* --- ambient + interaction juice --- */
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes snowFall { 0% { transform: translateY(-70px); } 100% { transform: translateY(1180px); } }
  @keyframes flakeSway { 0%,100% { transform: translateX(-24px); } 50% { transform: translateX(24px); } }
  @keyframes ripple { 0% { transform: scale(0.18); opacity: 0.9; } 100% { transform: scale(2.5); opacity: 0; } }
  @keyframes textIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes textInB { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  /* Interactive affordances live on separate layers so feedback animations keep their transforms. */
  @keyframes actionGlow { 0%,100% { opacity:.35; } 50% { opacity:.85; } }
  @keyframes actionShine { 0%,65% { background-position:180% 0; } 100% { background-position:-80% 0; } }
  .game-action { position:relative; isolation:isolate; touch-action:manipulation; transition:scale 140ms ease; }
  .game-action::before { content:''; position:absolute; inset:-4px; border-radius:inherit; pointer-events:none; opacity:0; box-shadow:0 0 0 2px rgba(80,205,255,.4),0 0 22px rgba(35,181,255,.4); transition:opacity 180ms; }
  [data-interactive="true"] .game-action::before { animation:actionGlow 3.2s ease-in-out infinite; }
  [data-interactive="true"] .game-action:hover::before,
  [data-interactive="true"] .game-action:focus-visible::before { animation:none; opacity:1; box-shadow:0 0 0 3px #a3edff,0 0 32px rgba(20,172,255,.65); }
  [data-interactive="true"] .game-action:active { scale:.96; }
  .game-action:focus-visible { outline:4px solid #f5c33f; outline-offset:7px; }
  .game-primary::after { content:''; position:absolute; inset:7px; border-radius:inherit; pointer-events:none; background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 49%,transparent 63%) 180% 0 / 250% 100% no-repeat; opacity:0; }
  [data-interactive="true"] .game-primary::after { opacity:1; animation:actionShine 4.5s ease-in-out infinite; }
  [data-interactive="true"] .game-handle { filter:drop-shadow(0 0 9px #22b8e6); }
  @media (prefers-reduced-motion:reduce) {
    .narrator-text span { animation:none !important; opacity:1 !important; transform:none !important; }
    .game-action,.game-action::before,.game-action::after,.game-action *,.game-handle { animation:none !important; transition:none !important; }
    [data-interactive="true"] .game-action::before { opacity:.55; }
    .game-primary::after { display:none; }
  }
</style>
<script src="polygon-data.js"></script>

</helmet>
<div ref="{{ stageRef }}" style="position:fixed;inset:0;width:100%;height:100%;background:#8ecff2 url(assets/background..png) center center / cover no-repeat;overflow:hidden">
  <div style="{{ scalerStyle }}">

    <!-- ============ frozen background ============ z 0 -->
    <img src="assets/background..png" alt="" style="{{ bgStyle }}" />

    <sc-for list="{{ snow }}" as="w" hint-placeholder-count="0">
      <div style="{{ w.wrap }}"><div style="{{ w.dot }}"></div></div>
    </sc-for>

    <!-- ============ ice board ============ z 30 -->
    <img src="assets/ice%20board.png" alt="" style="{{ boardStyle }}" />

    <!-- ============ learning content ============ z 32, inside the board's safe area -->
    <div ref="{{ safeRef }}" data-screen-label="{{ screenLabel }}" data-interactive="{{ effectsEnabled }}" onPointerDown="{{ stageDown }}" style="{{ safeStyle }}">

      <sc-if value="{{ showZones }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;left:0;top:376px;width:100%;display:flex;gap:52px">
          <div ref="{{ zoneARef }}" style="{{ zoneAStyle }}">
            <div style="font:900 30px Nunito,sans-serif;color:#1f6d4a;letter-spacing:0.06em">{{ zoneAName }}</div>
            <div style="font:700 21px Nunito,sans-serif;color:#57907a;margin-top:2px">{{ zoneASub }}</div>
          </div>
          <div ref="{{ zoneBRef }}" style="{{ zoneBStyle }}">
            <div style="font:900 30px Nunito,sans-serif;color:#a8395f;letter-spacing:0.06em">{{ zoneBName }}</div>
            <div style="font:700 21px Nunito,sans-serif;color:#bd7a92;margin-top:2px">{{ zoneBSub }}</div>
          </div>
        </div>
      </sc-if>

      <sc-for list="{{ cards }}" as="c" hint-placeholder-count="0">
        <div class="{{ c.click ? 'game-action' : '' }}" role="{{ c.click ? 'button' : undefined }}" tabIndex="{{ c.click && effectsEnabled ? 0 : -1 }}" onKeyDown="{{ activateKey }}" data-nudge="{{ c.nudge }}" style="{{ c.wrap }}" onPointerDown="{{ c.down }}" onPointerEnter="{{ c.enter }}" onPointerLeave="{{ c.leave }}" onClick="{{ c.click }}">
          <div style="{{ c.glow }}"></div>
          <svg viewBox="{{ c.vb }}" style="{{ c.svgStyle }}" ref="{{ c.svgRef }}">
            <g style="{{ c.gStyle }}">
              <path class="{{ c.pathClass }}" style="{{ c.pathStyle }}" d="{{ c.d }}" fill="{{ c.fill }}" stroke="{{ c.stroke }}" stroke-width="{{ c.sw }}" stroke-linejoin="round" stroke-linecap="round"></path>
              <path style="{{ c.outlineStyle }}" d="{{ c.extra }}" fill="none" stroke="{{ c.stroke }}" stroke-width="{{ c.sw }}" stroke-linecap="round"></path>
              <sc-for list="{{ c.hl }}" as="s" hint-placeholder-count="0">
                <path d="{{ s.d }}" fill="none" stroke="{{ s.color }}" stroke-width="{{ s.w }}" stroke-linecap="round" stroke-linejoin="round" style="{{ s.style }}"></path>
              </sc-for>
              <path data-trace="1" d="{{ c.traceD }}" fill="none" stroke="#22b8e6" stroke-width="{{ c.traceW }}" stroke-linecap="round" stroke-linejoin="round" pathLength="100" style="{{ c.traceStyle }}"></path>
              <sc-for list="{{ c.arcs }}" as="a" hint-placeholder-count="0">
                <path d="{{ a.d }}" fill="none" stroke="{{ a.color }}" stroke-width="{{ a.w }}" stroke-linecap="round"></path>
              </sc-for>
              <sc-for list="{{ c.dots }}" as="p" hint-placeholder-count="0">
                <circle data-dot="{{ p.dot }}" cx="{{ p.x }}" cy="{{ p.y }}" r="{{ p.r }}" fill="{{ p.fill }}" stroke="{{ p.stroke }}" stroke-width="{{ p.sw }}" style="{{ p.style }}"></circle>
              </sc-for>
              <sc-for list="{{ c.handles }}" as="h" hint-placeholder-count="0">
                <g>
                  <circle cx="{{ h.x }}" cy="{{ h.y }}" r="{{ h.hit }}" fill="rgba(0,0,0,0)" style="cursor:grab" onPointerDown="{{ h.down }}"></circle>
                  <circle cx="{{ h.x }}" cy="{{ h.y }}" r="{{ h.r }}" class="game-handle" fill="#ffffff" stroke="#22b8e6" stroke-width="{{ h.sw }}" style="pointer-events:none"></circle>
                </g>
              </sc-for>
            </g>
          </svg>
          <sc-for list="{{ c.pins }}" as="p" hint-placeholder-count="0">
            <div style="{{ p.style }}">{{ p.n }}</div>
          </sc-for>
          <div style="{{ c.badgeStyle }}">{{ c.badge }}</div>
          <div style="{{ c.chipStyle }}">{{ c.chip }}</div>
          <div style="{{ c.markStyle }}">{{ c.mark }}</div>
        </div>
      </sc-for>

      <sc-for list="{{ targets }}" as="t" hint-placeholder-count="0">
        <div class="{{ t.click ? 'game-action' : '' }}" role="{{ t.click ? 'button' : undefined }}" tabIndex="{{ t.click && effectsEnabled ? 0 : -1 }}" onKeyDown="{{ activateKey }}" data-label-target="{{ t.labelKey }}" data-nudge="{{ t.nudge }}" style="{{ t.style }}" onPointerEnter="{{ t.enter }}" onPointerLeave="{{ t.leave }}" onClick="{{ t.click }}">{{ t.text }}</div>
      </sc-for>

      <sc-for list="{{ callouts }}" as="o" hint-placeholder-count="0">
        <div style="{{ o.style }}">{{ o.text }}</div>
      </sc-for>

      <sc-for list="{{ leaders }}" as="l" hint-placeholder-count="0">
        <div style="{{ l.style }}"></div>
      </sc-for>

      <sc-for list="{{ drops }}" as="d" hint-placeholder-count="0">
        <div style="{{ d.style }}">

          <div class="{{ d.click ? 'game-action game-primary' : '' }}" role="{{ d.click ? 'button' : undefined }}" tabIndex="{{ d.click && effectsEnabled ? 0 : -1 }}" onKeyDown="{{ activateKey }}" data-nudge="{{ d.nudge }}" onClick="{{ d.click }}" onPointerEnter="{{ d.enter }}" onPointerLeave="{{ d.leave }}" style="{{ d.btn }}">
            <span>{{ d.label }}</span>
            <span aria-hidden="true" style="{{ d.arrowStyle }}">{{ d.arrow }}</span>
          </div>
          <sc-for list="{{ d.menu }}" as="m" hint-placeholder-count="0">
            <div class="{{ m.click ? 'game-action' : '' }}" role="{{ m.click ? 'button' : undefined }}" tabIndex="{{ m.click && effectsEnabled ? 0 : -1 }}" onKeyDown="{{ activateKey }}" onClick="{{ m.click }}" onPointerEnter="{{ m.enter }}" onPointerLeave="{{ m.leave }}" style="{{ m.style }}">{{ m.text }}</div>
          </sc-for>
        </div>
      </sc-for>

      <sc-if value="{{ showChoice }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;left:0;bottom:6px;width:100%;display:flex;justify-content:center;gap:74px">
          <div class="{{ chooseOpen ? 'game-action game-primary' : '' }}" role="{{ chooseOpen ? 'button' : undefined }}" tabIndex="{{ chooseOpen && effectsEnabled ? 0 : -1 }}" onKeyDown="{{ activateKey }}" data-nudge="{{ nudgeOC }}" onClick="{{ chooseOpen }}" onPointerEnter="{{ hovOpen }}" onPointerLeave="{{ hovOut }}" style="{{ btnOpen }}">Open</div>
          <div class="{{ chooseClosed ? 'game-action game-primary' : '' }}" role="{{ chooseClosed ? 'button' : undefined }}" tabIndex="{{ chooseClosed && effectsEnabled ? 0 : -1 }}" onKeyDown="{{ activateKey }}" data-nudge="{{ nudgeClosed }}" onClick="{{ chooseClosed }}" onPointerEnter="{{ hovClosed }}" onPointerLeave="{{ hovOut }}" style="{{ btnClosed }}">Closed</div>
        </div>
      </sc-if>

      <sc-if value="{{ showChips }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;left:0;bottom:10px;width:100%;display:flex;justify-content:center;gap:44px">
          <sc-for list="{{ chips }}" as="p" hint-placeholder-count="3">
            <div class="{{ p.click ? 'game-action' : '' }}" role="{{ p.click ? 'button' : undefined }}" tabIndex="{{ p.click && effectsEnabled ? 0 : -1 }}" onKeyDown="{{ activateKey }}" data-nudge="{{ p.nudge }}" onPointerDown="{{ p.down }}" onPointerEnter="{{ p.enter }}" onPointerLeave="{{ p.leave }}" onClick="{{ p.click }}" style="{{ p.style }}">{{ p.text }}</div>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{ showCounter }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;left:0;bottom:8px;width:100%;display:flex;justify-content:center;align-items:center;gap:34px">
          <sc-for list="{{ counters }}" as="n" hint-placeholder-count="1">
            <div style="{{ n.wrap }}">
              <div style="{{ n.captionStyle || {font: '800 22px Nunito,sans-serif',color: '#3c7bbd',textAlign: 'center',lineHeight: 1.1,width: '104px'} }}">{{ n.caption }}</div>
              <div class="{{ n.minus ? 'game-action' : '' }}" role="{{ n.minus ? 'button' : undefined }}" tabIndex="{{ n.minus && effectsEnabled ? 0 : -1 }}" onKeyDown="{{ activateKey }}" onClick="{{ n.minus }}" onPointerEnter="{{ n.mIn }}" onPointerLeave="{{ n.out }}" style="{{ n.btnM }}">–</div>
              <div style="{{ n.box }}">{{ n.value }}</div>
              <div class="{{ n.plus ? 'game-action' : '' }}" role="{{ n.plus ? 'button' : undefined }}" tabIndex="{{ n.plus && effectsEnabled ? 0 : -1 }}" onKeyDown="{{ activateKey }}" data-nudge="{{ n.nudge }}" onClick="{{ n.plus }}" onPointerEnter="{{ n.pIn }}" onPointerLeave="{{ n.out }}" style="{{ n.btnP }}">+</div>
            </div>
          </sc-for>
          <div class="{{ check ? 'game-action game-primary' : '' }}" role="{{ check ? 'button' : undefined }}" tabIndex="{{ check && effectsEnabled ? 0 : -1 }}" onKeyDown="{{ activateKey }}" data-nudge="{{ nudgeCheck }}" onClick="{{ check }}" onPointerEnter="{{ hovCheck }}" onPointerLeave="{{ hovOut }}" style="{{ checkStyle }}">{{ checkLabel }}</div>
        </div>
      </sc-if>

      <sc-if value="{{ showCheck }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;left:0;bottom:6px;width:100%;display:flex;justify-content:center">
          <div class="{{ check ? 'game-action game-primary' : '' }}" role="{{ check ? 'button' : undefined }}" tabIndex="{{ check && effectsEnabled ? 0 : -1 }}" onKeyDown="{{ activateKey }}" data-nudge="{{ nudgeCheck }}" onClick="{{ check }}" onPointerEnter="{{ hovCheck }}" onPointerLeave="{{ hovOut }}" style="{{ checkStyle }}">{{ checkLabel }}</div>
        </div>
      </sc-if>

      <sc-if value="{{ showHand }}" hint-placeholder-val="{{ false }}">
        <img src="assets/handNudge.webp" alt="" style="{{ handStyle }}" />
      </sc-if>

      <sc-for list="{{ fx }}" as="f" hint-placeholder-count="0">
        <div class="{{ f.className }}" style="{{ f.style }}">{{ f.t }}</div>
      </sc-for>

      <sc-if value="{{ showNudge }}" hint-placeholder-val="{{ false }}">
        <div style="{{ nudgeWrap }}">
          <div style="{{ nudgeRing }}"></div>
          <img src="assets/handNudge.webp" alt="" style="{{ nudgeHand }}" />
        </div>
      </sc-if>
    </div>

    <!-- ============ wooden instruction sign ============ z 40 -->
    <img src="assets/ui_sign.png" alt="" style="{{ signStyle }}" />
    <div style="{{ signTextBox }}">
      <div class="narrator-text" ref="{{ narrRef }}" style="{{ narrStyle }}"><sc-for list="{{ narratorParts }}" as="part" hint-placeholder-count="0"><span key="{{ part.key }}" style="{{ part.style }}">{{ part.text }}</span></sc-for></div>
    </div>

    <sc-if value="{{ voiceError }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ retryVoice }}" style="position:absolute;left:50%;bottom:24px;translate:-50% 0;z-index:90;padding:14px 32px;border:3px solid white;border-radius:30px;background:#167bb7;color:white;font:800 26px Nunito,sans-serif;cursor:pointer">{{ voiceError }}</button>
    </sc-if>
    <div ref="{{ ghostRef }}" style="position:absolute;left:0;top:0;pointer-events:none;opacity:0;z-index:60"></div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1320,&quot;height&quot;:720}}">
const IK = '#f58420', ICE = '#22b8e6', GRN = '#2f9e5e', RED = '#e8553f', GOLD = '#e9a733';

/* ============================================================================
   MASTER GAME STAGE
   Every layer is placed as a percentage of this 1980x1080 reference stage and
   the whole stage is scaled by one transform, so the composition can never
   drift apart between 1920x1080 and 1024x576 — there is only ever one number
   driving layout. Boxes below were measured off the reference art itself.
   ========================================================================= */
const STAGE = { w: 1980, h: 1080 };
const LAYER = {
  board:   { x: 68,  y: 158, w: 1844, h: 871 },   /* 3.43% / 14.63% / 93.13% / 80.65% */
  sign:    { x: 443, y: 6,   w: 1095, h: 155 },   /* 22.37% / 0.56% / 55.30% / 14.35% */
  mammoth: { x: 164, y: 24,  w: 269,  h: 181 }    /* 8.28% / 2.22% / 13.59% / 16.76%  */
};
/* Learning content lives here: inset from the ice border on all four sides so
   nothing ever touches the frozen frame. */
const SAFE = { x: 197, y: 245, w: 1585, h: 716 };
/* The sign's usable inner text box — clear of the rope bolts and both
   snowflake decorations, and only as tall as the plank's wood band. */
const NARR = { x: 573, y: 44, w: 835, h: 94 };
const NARR_TYPE = { size: 38, color: '#633c19', accent: '#2c63b9', outline: 3 };
// Reserve animation headroom and a gap before the sign, keeping the paw baseline.
const MAM_SAFE = { top: STAGE.h * 0.02, right: (LAYER.sign.x - LAYER.mammoth.x) * 0.05, motion: 20 };
const MAM_BASELINE = LAYER.mammoth.y + LAYER.mammoth.h;
const MAM_AREA = { x: LAYER.mammoth.x, y: MAM_SAFE.top,
  w: LAYER.sign.x - LAYER.mammoth.x, h: MAM_BASELINE - MAM_SAFE.top };
const MAM_HEIGHT = Math.min(LAYER.mammoth.h, MAM_AREA.h - MAM_SAFE.motion,
  (MAM_AREA.w - MAM_SAFE.right) * 510 / 760);
const MAM_WIDTH = MAM_HEIGHT * 760 / 510;

function pc(v, total) { return (100 * v / total).toFixed(4) + '%'; }
/* Turns a stage-pixel box into a percentage-positioned absolute style. */
function stageBox(L, z) {
  return {
    position: 'absolute', left: pc(L.x, STAGE.w), top: pc(L.y, STAGE.h),
    width: pc(L.w, STAGE.w), height: pc(L.h, STAGE.h), zIndex: z
  };
}

/* ============================================================================
   MAMMOTH GUIDE — reusable character state machine
   Screens never pick animations themselves; they raise semantic events and the
   guide decides the pose. Both sprites share one 760x510 canvas and every pose
   animates transform only inside a fixed viewport, so swapping expression can
   never change the character's anchor, scale or baseline.
   ========================================================================= */
const MAMMOTH_STATES = {
  ENTER: 'ENTER', IDLE: 'IDLE', TALKING: 'TALKING', ENCOURAGING: 'ENCOURAGING',
  CURIOUS: 'CURIOUS', THINKING: 'THINKING', WATCHING: 'WATCHING',
  SUCCESS: 'SUCCESS', WRONG: 'WRONG', SURPRISED: 'SURPRISED', CELEBRATE: 'CELEBRATE'
};
/* sad: true selects the mam_sad sprite. hold: ms means the pose is temporary
   and the guide returns to its resting pose afterwards. */
const MAMMOTH_POSE = {
  ENTER:       { anim: 'mamRise 820ms cubic-bezier(.24,.9,.26,1) both' },
  IDLE:        { anim: 'mamBreathe 4.6s ease-in-out infinite' },
  TALKING:     { anim: 'mamTalk 2.1s ease-in-out infinite' },
  WATCHING:    { anim: 'mamWatch 4.2s ease-in-out infinite' },
  CURIOUS:     { anim: 'mamCurious 3.2s ease-in-out infinite' },
  THINKING:    { anim: 'mamThink 3.6s ease-in-out infinite' },
  ENCOURAGING: { anim: 'mamNod 1000ms ease-in-out both', hold: 1100 },
  SUCCESS:     { anim: 'mamSuccess# 900ms ease-in-out both', hold: 1000, once: true },
  CELEBRATE:   { anim: 'mamCelebrate 2.2s ease-in-out infinite' },
  SURPRISED:   { anim: 'mamSurprise# 760ms ease-out both', hold: 900, once: true },
  WRONG:       { anim: 'mamOops# 700ms ease-out both', hold: 1200, once: true, sad: true }
};

class MammothGuide {
  constructor(host) {
    this.host = host;
    this.current = MAMMOTH_STATES.IDLE;
    this.resting = MAMMOTH_STATES.IDLE;
    this._hold = null;
    this._queued = null;
  }
  /* The single entry point. opts.then overrides where a temporary pose lands.
     A reaction (a pose with a hold) outranks the ambient poses, so the oops
     or the cheer plays out in full and the talking pose queues behind it —
     otherwise the corrective line would wipe the reaction the moment it starts. */
  setState(name, opts) {
    const pose = MAMMOTH_POSE[name];
    if (!pose) return;
    const o = opts || {};
    const ambient = !pose.hold;
    /* queue the ambient pose; it lands the moment the reaction finishes */
    if (this._hold && ambient && !o.force) { this.resting = name; this._queued = name; return; }
    if (this._hold) { clearTimeout(this._hold); this._hold = null; }
    this._queued = null;
    this.current = name;
    if (ambient) this.resting = name;
    const back = o.then || this.resting;
    this.host.setState((st) => ({ mamState: name, mamTick: (st.mamTick || 0) + 1 }));
    if (pose.hold) {
      this._hold = this.host.later(() => {
        this._hold = null;
        const next = this._queued || back;
        this._queued = null;
        if (this.current === name) this.setState(next, { force: true });
      }, o.hold || pose.hold);
    }
  }
  /* runStep clears every component timer, so any pending reaction dies with
     them — drop the handle too or it would block ambient poses forever. */
  reset() { this._hold = null; this._queued = null; this.resting = MAMMOTH_STATES.IDLE; }
  /* Resolves the pose into a sprite + animation for the current render. */
  pose() {
    const p = MAMMOTH_POSE[this.current] || MAMMOTH_POSE.IDLE;
    const tick = this.host.state.mamTick || 0;
    return {
      sad: !!p.sad,
      anim: p.once ? p.anim.replace('#', tick % 2 ? 'A' : 'B') : p.anim
    };
  }
  /* ---- semantic events: the only thing screens should call ---- */
  onScreenEnter() { this.setState(MAMMOTH_STATES.ENTER, { then: MAMMOTH_STATES.IDLE, force: true }); }
  onInstructionStart() { this.setState(MAMMOTH_STATES.TALKING); }
  onInstructionComplete() { this.setState(MAMMOTH_STATES.WATCHING); }
  onInteractionStart() { this.setState(MAMMOTH_STATES.WATCHING); }
  onCorrectProgress() { this.setState(MAMMOTH_STATES.ENCOURAGING, { then: MAMMOTH_STATES.WATCHING }); }
  onWrongAttempt() { this.setState(MAMMOTH_STATES.WRONG, { then: MAMMOTH_STATES.WATCHING }); }
  onCorrectAnswer() { this.setState(MAMMOTH_STATES.SUCCESS, { then: MAMMOTH_STATES.WATCHING }); }
  onSurprise() { this.setState(MAMMOTH_STATES.SURPRISED, { then: MAMMOTH_STATES.WATCHING }); }
  onScreenComplete() { this.setState(MAMMOTH_STATES.CELEBRATE); }
}

  pickChip(name) {

  hitTarget(key) {

      if (this.state.placed[key]) return;

        const done = Object.keys(placed).length === 3;

        if (done) {

  /* ---------- sort zones (CFU 2 / 5) ---------- */
  dropInto(zone) {
    return () => {
      if (this.locked()) return;

      if (i === null || i === undefined) return;
      const s = this.step();
      const at = Object.assign({}, this.state.sortAt);
      if (s.answer[i] === zone) {
        at[i] = zone;
        const done = Object.keys(at).length === s.answer.length;
        this.setState({ sortAt: at, pickedFig: null }); this.sfx('snap');
        if (done) this.react('happy'); else { this.burstHere(); this.guide.onCorrectProgress(); }
        if (Object.keys(at).length === s.answer.length) {
          this.setState({ checked: true }); this.sfx('done'); this.confetti();
          this.feedback(s.fb.ok, () => this.later(this.advance, 500));
        }
      } else {
        const a = this.state.attempts + 1;
        this.setState({ pickedFig: null, wrong: i, attempts: a }); this.sfx('no'); this.react('wrong');
        this.later(() => this.setState({ wrong: null }), 700);
        this.feedback(a >= 2 ? s.fb.two : s.fb.one, () => this.restoreQuestion());
      }
    };
  }

  /* ---------- card building (number badges are HTML overlays) ---------- */

  buildCard(o) {

    const iw = o.w - 2 * pad, ih = o.h - 2 * pad;
    const fsc = Math.min(iw / v[2], ih / v[3]);
    const ox = pad + (iw - v[2] * fsc) / 2, oy = pad + (ih - v[3] * fsc) / 2;
    const toPx = (p) => [ox + (p[0] - v[0]) * fsc, oy + (p[1] - v[1]) * fsc];
    const wrap = Object.assign({
      position: 'absolute', left: o.x + 'px', top: o.y + 'px', width: o.w + 'px', height: o.h + 'px',
      borderRadius: '30px', boxSizing: 'border-box', padding: (o.pad || 20) + 'px',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      transition: 'left 420ms cubic-bezier(.22,.9,.24,1), top 420ms cubic-bezier(.22,.9,.24,1), width 420ms, height 420ms, opacity 380ms, transform 260ms, border-color 200ms, background 200ms',
      touchAction: o.down ? 'none' : 'manipulation', cursor: o.down ? 'grab' : (o.click ? 'pointer' : 'default'), opacity: o.opacity === undefined ? 1 : o.opacity,
      animation: o.anim || 'none', zIndex: o.z || 2
    }, base);
    if (o.plain) { wrap.border = 'none'; wrap.background = 'transparent'; wrap.boxShadow = 'none'; }
    /* --- live feel: hover lifts the card, press squashes it, idle breathes --- */
    const hk = 'card:' + o.key;

      stroke: stroke,

      outlineStyle: stroke === IK ? { filter: 'drop-shadow(0 0 ' + (7 * kk) + 'px rgba(255,145,30,.48))' } : {},

      handles: o.handles || [], traceD: o.traceD || '', traceW: +(((o.sw || 16) + 7) * kk).toFixed(2),

  // Shared by every instruction, correction, success message and replay.
  prepareNarratorReveal(text, durationMs) {
    const known = durationMs || (this._voiceDurations && this._voiceDurations[text]);
    const count = (text.match(/\S+/g) || []).length;
    const interval = Number.isFinite(known) && known > 0 && count > 1
      ? Math.max(0, (known - 220) / (count - 1)) : 110;
    this.setState(st => ({ narrPage: text, narrTick: st.narrTick + 1,
      wordReveal: 'waiting', wordInterval: interval }));
  }
  narratorParts() {
    const text = this.state.narrPage === undefined ? this.state.narr || '' : this.state.narrPage;
    const tokens = text.split(/(\s+)/).filter(Boolean);
    let word = 0;
    return tokens.map((token, index) => {
      const key = this.state.narrTick + '-' + index;
      if (!/\S/.test(token)) return { key, text: token, style: { whiteSpace: 'pre' } };
      const shape = /\b(?:triangles?|quadrilaterals?|pentagons?|hexagons?|heptagons?|octagons?|polygons?)\b/gi;
      const highlighted = shape.test(token);
      shape.lastIndex = 0;
      const delay = Math.round(word++ * (this.state.wordInterval === undefined ? 110 : this.state.wordInterval));
      return {
        key, text: token.replace(shape, name => name.toUpperCase()),
        style: {
          display: 'inline-block', color: highlighted ? NARR_TYPE.accent : NARR_TYPE.color,
          transformOrigin: '50% 70%',
          animation: this.state.wordReveal === 'complete' ? 'none' : (this.state.narrTick % 2 ? 'textIn' : 'textInB') + ' 220ms ease-in ' + delay + 'ms both',
          animationPlayState: this.state.wordReveal === 'waiting' ? 'paused' : 'running'
        }
      };
    });
  }

    return {
      width: NARR.w + 'px',
      fontFamily: '"Baloo 2", Nunito, sans-serif', fontWeight: 800,
      fontSize: Math.min(NARR_TYPE.size, NARR_TYPE.size * (NARR.w - 24) / Math.max(1, this.narratorWidth(this.state.narrPage || this.state.narr || ''))) + 'px', lineHeight: 1.18, letterSpacing: '0.005em',
      color: NARR_TYPE.color, textAlign: 'center', whiteSpace: 'nowrap',
      overflowWrap: 'normal',
      WebkitTextStrokeWidth: NARR_TYPE.outline + 'px',

  /* ----- screen 1 ----- */
  viewS1(V, s) {
    const st = this.state, ph = st.phase;

    const size = 470;

        text: 'Point', style: {

        }

      dots: st.drawing ? [{ dot: '1', x: F.pts[0][0], y: F.pts[0][1], r: 23, fill: '#fff', stroke: ICE, sw: 10, style: { filter: 'drop-shadow(0 0 12px rgba(34,184,230,0.9))' } }] : [],
      hl: st.ok === 'closed' ? [{ d: drawnD, color: GRN, w: 20 * this.k('leaf'), style: {} }] : []

  /* ----- screens 2-5 ----- */
  viewOC(V, s) {

  /* ----- screen 6 + 7 ----- */
  cmpCards(V, s, tappable) {
    const st = this.state, S = this.sets()[s.set];
    const w = 330, h = 330, gap = 42, total = S.length * w + (S.length - 1) * gap;
    const x0 = (SAFE.w - total) / 2, y = 130;
    const openIdx = [1, 2], closedIdx = [0, 3], straightIdx = [0, 1], curvedIdx = [2, 3];
    const ph = st.phase;
    return S.map((it, i) => {
      const name = it[0], F = this.fig(name), d = this.figD(name);
      let pulse = false, hl = [];
      if (ph === 'open' && openIdx.indexOf(i) >= 0) pulse = true;
      if (ph === 'closed' && closedIdx.indexOf(i) >= 0) pulse = true;
      if (st.hlKind === 'straight' && straightIdx.indexOf(i) >= 0) pulse = true;
      if (st.hlKind === 'curved' && curvedIdx.indexOf(i) >= 0) pulse = true;
      if (st.hlKind === 'segsOf' + i || st.hlKind === 'curveOf' + i) {
        hl = F.pts ? this.segHl(name, F.pts.map((p, j) => j), null, ICE, 22) : [{ d: d, color: ICE, w: 22, style: {} }];
      }
      const trace = st.tracing && (ph === 'bound' || ph === 'sc');
      let state = null;
      if (tappable) {
        if (st.ok === i || (s.q === 'straight' && st.sel.includes(i))) state = 'ok'; else if (st.wrong === i) state = 'bad';
      }
      let chip = '', chipBg, chipBorder, chipColor;
      const showChip = ph !== 'open' || openIdx.indexOf(i) >= 0;
      if ((ph === 'open' && openIdx.indexOf(i) >= 0) || ph === 'closed' || ph === 'bound' || ph === 'sc' || ph === 'classify' || ph === 'done' || tappable) {
        const isOpen = openIdx.indexOf(i) >= 0;
        if (ph === 'open' && !isOpen) chip = '';
        else { chip = isOpen ? 'Open' : 'Closed'; chipBg = isOpen ? '#fff3e3' : '#e9f7ee'; chipBorder = isOpen ? '#f0c58a' : '#a6dcbb'; chipColor = isOpen ? '#a1642a' : '#26714b'; }
      }
      return this.buildCard({
        key: name + i, x: x0 + i * (w + gap), y: y, w: w, h: h, vb: F.vb, d: d, extra: F.extra || '',
        stroke: it[1], sw: 18, state: state, hl: hl,
        traceD: d, traceStyle: trace ? this.traceStyleFor(true, 1400) : { opacity: 0 },
        anim: st.wrong === i ? 'wig 420ms ease-in-out both' : (pulse ? 'pop 900ms ease-in-out infinite' : 'none'),

        click: tappable ? this.tapCard(i) : null,

    });
  }

    const st = this.state, ph = st.phase, F = this.fig('pentagon'), K = this.k('pentagon');

    V.targets = spots.map((sp) => {

          display: 'flex', alignItems: 'center', justifyContent: 'center',
          cursor: done ? 'default' : 'pointer', transform:st.labelHover === sp.key ? 'scale(1.05)' : 'none', transition:'transform 150ms,box-shadow 150ms', boxShadow: st.labelHover === sp.key ? '0 0 0 4px #ffd45b,0 0 26px rgba(255,196,50,.65)' : '0 6px 0 rgba(146,196,228,0.32)',
          animation: bad ? 'wig 420ms ease-in-out both' : 'none', zIndex: 6
        }
      };
    });

    V.showChips = true;
    const chipNames = ['Side', 'Vertex', 'Angle'];
    const firstFree = chipNames.findIndex((t) => !Object.keys(p).some((k) => p[k] === t));
    V.chips = chipNames.map((t, ci) => {
      const used = Object.keys(p).some((k) => p[k] === t);
      const active = st.chip === t;
      return {
        nudge: !st.chip && ci === firstFree ? '1' : '', text: t, click: this.pickChip(t), down: this.dragLabel(t),
        style: {
          padding: '0 40px', height: '78px', borderRadius: '39px', boxSizing: 'border-box',
          background: used ? '#eef4f8' : (active ? 'linear-gradient(#ffe98b,#ffc43b)' : 'linear-gradient(#48baf3,#1583cc)'),
          border: '5px solid ' + (used ? '#dbe6ee' : (active ? '#0f8fba' : '#a9dcf6')),
          color: used ? '#b3c4d0' : (active ? '#674015' : '#ffffff'),
          font: '800 36px "Baloo 2", Nunito, sans-serif', display: 'flex', alignItems: 'center',
          touchAction:'none', cursor: used ? 'default' : 'grab', opacity: st.draggingLabel === t ? 0.35 : (used ? 0.55 : 1),
          boxShadow: '0 7px 0 rgba(146,196,228,0.42)', transform: active ? 'translateY(-4px)' : 'none',
          transition: 'all 160ms ease-out', userSelect: 'none'
        }
      };
    });
  }

  /* ----- screen 13 count ----- */
  viewCount(V, s) {
    const st = this.state, F = this.fig('pentagon'), size = 400, K = this.k('pentagon');
    const segs = this.segs('pentagon'), c = this.centroid(F.pts);
    const nums = [];
    for (let i = 0; i < st.nums; i++) {
      const m = segs[i].mid, u = this.unit(c, m), o = 58 * K;
      nums.push({ x: +(m[0] + u[0] * o).toFixed(1), y: +(m[1] + u[1] * o).toFixed(1), ty: +(m[1] + u[1] * o + 15 * K).toFixed(1), r: 38 * K, sw: 8 * K, fs: 46 * K, t: String(i + 1) });
    }

    V.cards = [this.buildCard({
      key: 'pent', x: (SAFE.w - size) / 2, y: 40, w: size, h: size, plain: true, vb: F.vb,
      d: this.figD('pentagon'), stroke: st.ok ? GRN : this.P.C.blue, sw: 18, hl: hl, nums: nums
    })];
    if (s.q === 'count') {
      V.showCounter = true;
      V.counters = [this.counter(0, '')];
      V.checkStyle = Object.assign({}, V.counters[0].btn, { font: '900 22px Nunito,sans-serif' });
      V.roundCounterCheck = true;
    }
  }
  counter(i, caption) {
    const st = this.state;

    const rim = good ? GRN : (bad ? RED : '#08b9f4');

      captionStyle: { display: caption ? 'block' : 'none', width: '112px', flexShrink: 0, font: '900 26px Nunito,sans-serif', color: '#073d7c', lineHeight: 1.08, textAlign: 'left' },
      wrap: {
        display: 'flex', alignItems: 'center', gap: '12px', padding: '12px 14px', borderRadius: '64px',
        background: good ? 'linear-gradient(#eafff1,#b4efd1)' : (bad ? 'linear-gradient(#fff2ed,#ffd3c6)' : 'linear-gradient(165deg,#e4fbff 0%,#b8edfc 48%,#8adaf8 100%)'),
        border: '4px solid ' + rim,
        boxShadow: 'inset 0 5px 0 rgba(255,255,255,.95), inset 0 -6px 0 rgba(0,152,225,.18), 0 6px 0 #159bce, 0 9px 20px ' + (good ? 'rgba(44,164,102,.3)' : bad ? 'rgba(225,72,65,.3)' : 'rgba(23,154,216,.22)'),

        border: '4px solid #0476c9', color: '#fff', font: '900 54px Nunito,sans-serif',
        display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', lineHeight: 1,
        textShadow: '0 2px 3px rgba(0,54,137,.45)',
        boxShadow: 'inset 0 4px 0 rgba(174,238,255,.75), inset 0 -5px 0 rgba(0,77,178,.24), 0 4px 0 #0464b6, 0 7px 12px rgba(0,120,213,.22)', userSelect: 'none'
      },

        border: '3px solid #79dbfa', color: '#093c7a', font: '900 58px Nunito, sans-serif',
        boxShadow: '0 0 0 5px rgba(87,209,250,.18), 0 3px 12px rgba(0,153,227,.2)',

      value: String(st.cnt[i]), minus: this.bump(i, -1), plus: this.bump(i, 1), nudge: i === 0 ? '1' : ''
    };
  }

  /* ----- screen 14 deform ----- */
  viewDeform(V, s) {
    const st = this.state, F = this.fig('pentagon'), size = 470, K = this.k('pentagon');
    const pts = st.userPts || F.pts;
    this.svgRefs[0] = this.svgRefs[0] || React.createRef();
    const showHandles = st.phase === 'drag' || st.phase === 'wow';
    V.cards = [this.buildCard({
      key: 'pent', x: (SAFE.w - size) / 2, y: 60, w: size, h: size, plain: true, vb: F.vb,

    })];

  /* ----- screens 15 / 16 ----- */
  viewBA(V, s) {
    const st = this.state, F = this.fig('pentagon'), K = this.k('pentagon');
    const orig = F.pts, user = st.userPts || F.pts;
    const size = 380, gapX = 200;
    const y = 60;
    const leftX = SAFE.w / 2 - gapX - size, rightX = SAFE.w / 2 + gapX - 0;
    const segsO = this.segs('pentagon'), segsU = this.segs('pentagon', user);
    const cO = this.centroid(orig), cU = this.centroid(user);
    const mk = (which) => {
      const pts = which ? user : orig, segs = which ? segsU : segsO, cc = which ? cU : cO;
      const n = which ? (st.numsB || 0) : (st.nums || 0);
      const nums = [];
      for (let i = 0; i < n; i++) {
        const m = segs[i].mid, u = this.unit(cc, m), o = 56 * K;
        nums.push({ x: +(m[0] + u[0] * o).toFixed(1), y: +(m[1] + u[1] * o).toFixed(1), ty: +(m[1] + u[1] * o + 14 * K).toFixed(1), r: 36 * K, sw: 8 * K, fs: 44 * K, t: String(i + 1) });
      }
      const glow = st.phase === 'b' ? [{ d: this.dPath(pts, true), color: 'rgba(34,184,230,0.55)', w: 34 * K, style: { animation: 'glowPulse 1.4s ease-in-out infinite' } }] : [];
      return this.buildCard({
        key: which ? 'after' : 'before', x: which ? rightX : leftX, y: y, w: size, h: size,
        vb: F.vb, d: this.dPath(pts, true), stroke: which ? this.P.C.orange : this.P.C.blue, sw: 18,
        fill: 'rgba(207,226,243,0.45)', hl: glow, nums: nums,
        badge: which ? 'After' : 'Before',
        anim: st.phase === 'a' ? 'pop 1200ms ease-in-out 2' : 'none'
      });
    };
    V.cards = [mk(false), mk(true)];
    if (s.q === 'count2') {
      V.showCounter = true;
      V.counters = [this.counter(0, 'Sides · Before'), this.counter(1, 'Sides · After')];
    }
  }

  /* ----- naming screens ----- */
  viewName(V, s) {
    const st = this.state, F = this.fig(s.fig), size = 440, K = this.k(s.fig);
    const pts = st.morph || F.pts;
    const segs = this.segs(s.fig, st.morph ? null : F.pts), c = this.centroid(F.pts);
    const nums = [];
    if (!st.morph) {
      for (let i = 0; i < st.nums; i++) {
        const m = segs[i].mid, u = this.unit(c, m), o = 60 * K;
        nums.push({ x: +(m[0] + u[0] * o).toFixed(1), y: +(m[1] + u[1] * o).toFixed(1), ty: +(m[1] + u[1] * o + 15 * K).toFixed(1), r: 38 * K, sw: 8 * K, fs: 46 * K, t: String(i + 1) });
      }
    }
    const hl = !st.morph && st.nums > 0 ? this.segHl(s.fig, [st.nums - 1], null, ICE, 26) : [];
    V.cards = [this.buildCard({
      key: s.fig, x: (SAFE.w - size) / 2, y: 40, w: size, h: size, plain: true,
      vb: F.vb, d: this.dPath(pts, true), stroke: this.P.C.blue, sw: 18,
      fill: 'rgba(207,226,243,0.45)', hl: hl, nums: nums
    })];
    if (st.reveal || st.nums >= (s.count || 99)) V.callouts = [this.labelPill(s.reveal, 540)];
  }

  /* ----- recall ----- */
  viewRecall(V, s) {
    const st = this.state, size = 420;
    const names = { 3: 'Triangle', 4: 'Quadrilateral', 5: 'Pentagon', 6: 'Hexagon', 7: 'Heptagon', 8: 'Octagon' };
    const pts = st.morph || this.P.reg(st.n, 500, 500, 300, st.n === 4 ? 45 : 0);
    V.cards = [this.buildCard({
      key: 'recall', x: (SAFE.w - size) / 2, y: 20, w: size, h: size, plain: true,
      vb: '150 150 700 700', d: this.dPath(pts, true), stroke: this.P.C.blue, sw: 18,
      fill: 'rgba(207,226,243,0.45)'
    })];
    V.callouts = [{
      text: names[st.n], style: {
        position: 'absolute', left: '50%', top: '452px', translate: '-50% 0',
        padding: '10px 46px', borderRadius: '30px', background: '#fff8e2', border: '5px solid ' + GOLD,
        font: '800 46px "Baloo 2", Nunito, sans-serif', color: '#8a5a12', whiteSpace: 'nowrap',
        boxShadow: '0 8px 0 rgba(198,146,44,0.35)', animation: 'pop 380ms ease-out both'
      }
    }];
    V.showCounter = true;
    V.counters = [{
      caption: 'Sides',
      wrap: { display: 'flex', alignItems: 'center', gap: '14px', padding: '10px 18px', borderRadius: '30px', background: 'rgba(255,255,255,0.9)', border: '4px solid #cfeafb', boxShadow: '0 6px 0 rgba(146,196,228,0.35)' },
      btn: { width: '68px', height: '68px', borderRadius: '50%', background: '#fff', border: '4px solid #a9dcf6', color: '#1d5c96', font: '800 40px Nunito, sans-serif', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', boxShadow: '0 5px 0 rgba(146,196,228,0.4)', userSelect: 'none' },
      box: { minWidth: '92px', height: '72px', borderRadius: '18px', background: '#f4fbff', border: '4px solid #cfeafb', color: '#123a6b', font: '900 44px Nunito, sans-serif', display: 'flex', alignItems: 'center', justifyContent: 'center' },
      value: String(st.n), minus: this.bumpN(-1), plus: this.bumpN(1), nudge: '1'
    }];
    V.showCounter = true;
    V.checkStyle = { display: 'none' };
    V.checkLabel = '';
    V.targets = [{
      text: 'Next', click: this.advance, nudge: '',
      style: Object.assign({ position: 'absolute', right: '10px', bottom: '14px', zIndex: 8 }, this.bigBtn(GRN, 200))
    }];
  }

  /* ----- multi select ----- */
  viewMulti(V, s) {
    const st = this.state, S = this.sets()[s.set];
    const n = S.length;
    const w = n >= 6 ? 236 : (n === 5 ? 272 : 300), gap = n >= 6 ? 26 : 38;
    const total = n * w + (n - 1) * gap;
    const x0 = (SAFE.w - total) / 2, y = s.sub ? 150 : 130;
    const done = s.correct.every((c) => st.sel.indexOf(c) >= 0) && st.sel.length === s.correct.length;
    V.cards = S.map((it, i) => {
      const F = this.fig(it[0]);
      const sel = st.sel.indexOf(i) >= 0;
      let state = null;
      if (st.wrong === i) state = 'bad';
      else if (sel && !s.check) state = 'ok';
      else if (sel && s.check) state = st.checked ? 'ok' : 'sel';
      const coach = st.hlKind === 'coach' && sel && s.correct.indexOf(i) < 0;
      return this.buildCard({
        key: it[0], x: x0 + i * (w + gap), y: y, w: w, h: w, vb: F.vb, d: this.figD(it[0]),
        extra: F.extra || '', stroke: it[1], sw: 20, fill: it[2] || 'none', state: state,
        badge: String.fromCharCode(65 + i), click: this.tapCard(i),
        traceD: this.figD(it[0]), traceStyle: coach ? this.traceStyleFor(true, 1500) : { opacity: 0 },
        anim: st.wrong === i ? 'wig 420ms ease-in-out both' : (coach ? 'pop 900ms ease-in-out infinite' : 'none')
      });
    });
    if (s.sub) {
      V.callouts = [{
        text: s.sub, style: {
          position: 'absolute', left: '50%', top: '46px', translate: '-50% 0',
          font: '800 32px Nunito, sans-serif', color: '#4c86bd', whiteSpace: 'nowrap'
        }
      }];
    }
    if (s.check) {
      V.showCheck = true;
      V.nudgeCheck = st.sel.length && !st.checked ? '1' : '';
      V.checkLabel = st.checked ? 'Next' : 'Check';
      V.checkStyle = this.bigBtn(st.checked ? GRN : (st.sel.length ? '#2f8fd0' : '#a9c7dd'), 250);
    } else if (done) {
      V.showCheck = true;
      V.checkLabel = 'Next';
      V.checkStyle = this.bigBtn(GRN, 230);
      V.check = this.advance;
    }
  }

  /* ----- sort ----- */
  viewSort(V, s) {
    const st = this.state, S = this.sets()[s.set];
    const n = S.length;
    const w = 190, gap = 26, total = n * w + (n - 1) * gap;
    const x0 = (SAFE.w - total) / 2;
    const zoneW = (SAFE.w - 52) / 2;
    V.showZones = true;
    V.zoneAName = s.zones[0]; V.zoneBName = s.zones[1];
    V.zoneASub = s.zones[2] || ''; V.zoneBSub = s.zones[3] || '';
    const holding = st.pickedFig !== null && st.pickedFig !== undefined;
    const zoneStyle = (which) => {
      const hot = holding && (st.sortHover === which || st.hoverK === 'tg' + which);
      return {
        width: zoneW + 'px', height: '338px', borderRadius: '30px', boxSizing: 'border-box',
        padding: '16px 18px',
        border: '5px ' + (hot ? 'solid ' : 'dashed ') + (which ? '#a995e4' : '#68b7df'),
        background: which
          ? (hot ? '#e9ddff' : '#f2edff')
          : (hot ? '#d4f1ff' : '#eaf8ff'),
        cursor: holding ? 'pointer' : 'default',
        transform: hot ? 'scale(1.015)' : 'scale(1)',
        boxShadow: hot ? '0 12px 26px rgba(31,109,180,0.18)' : 'none',
        animation: holding && !hot ? 'glowPulse 1.6s ease-in-out infinite' : 'none',
        transition: 'all 200ms ease-out', textAlign: 'center'
      };
    };
    V.zoneAStyle = zoneStyle(0); V.zoneBStyle = zoneStyle(1);
    const counts = [0, 0];
    V.cards = S.map((it, i) => {
      const F = this.fig(it[0]);
      const at = st.sortAt[i];
      const picked = st.pickedFig === i;
      let x, y, size;
      if (at === undefined) { x = x0 + i * (w + gap); y = 30; size = w; }
      else {
        const col = counts[at]++;
        size = 150;
        x = (at ? zoneW + 52 : 0) + 30 + col * (size + 18);
        y = 376 + 92;
      }
      return this.buildCard({
        key: it[0], x: x, y: y, w: size, h: size, vb: F.vb, d: this.figD(it[0]),
        extra: F.extra || '', stroke: it[1], sw: 22, pad: 14,
        state: at !== undefined ? 'ok' : (st.wrong === i ? 'bad' : (picked ? 'sel' : null)),
        click: at === undefined ? this.tapCard(i) : null, down: at === undefined ? this.dragFigure(i) : null,
        opacity:st.draggingFigure === i ? 0.3 : 1,
        nudge: at === undefined && st.pickedFig === null && !Object.keys(st.sortAt).length && i === 0,
        z: at === undefined ? 8 : 9,
        anim: st.wrong === i ? 'wig 420ms ease-in-out both' : (picked ? 'pop 900ms ease-in-out infinite' : 'none')
      });
    });
    V.targets = [
      { text: '', click: this.dropInto(0), nudge: st.pickedFig !== null && s.answer[st.pickedFig] === 0 && !Object.keys(st.sortAt).length ? '1' : '', style: { position: 'absolute', left: '0px', top: '376px', width: zoneW + 'px', height: '338px', zIndex: 3, cursor: st.pickedFig !== null ? 'pointer' : 'default' } },
      { text: '', click: this.dropInto(1), nudge: st.pickedFig !== null && s.answer[st.pickedFig] === 1 && !Object.keys(st.sortAt).length ? '1' : '', style: { position: 'absolute', left: (zoneW + 52) + 'px', top: '376px', width: zoneW + 'px', height: '338px', zIndex: 3, cursor: st.pickedFig !== null ? 'pointer' : 'default' } }
    ];
    V.callouts = [{
      text: st.pickedFig === null || st.pickedFig === undefined ? 'Drag each figure into its matching column' : 'Drag into a column and release',
      style: {
        position: 'absolute', left: '50%', top: '250px', translate: '-50% 0',
        font: '800 28px Nunito, sans-serif', color: '#4c86bd', whiteSpace: 'nowrap'
      }
    }];
  }

  restart = () => {
    if (this.locked()) return;
    this.sfx('tap');
    this.setState({ k: 0, userPts: null, dragged: false, drawn: false }, () => {
      this.save();
      this.runStep(0, false);
    });
  };
  viewEnd(V, s) {
    const row = [['triangle', this.P.C.purple], ['quad', this.P.C.orange], ['pentagon', this.P.C.blue],
      ['hexagon', this.P.C.green], ['heptagon', this.P.C.pink], ['octagon', this.P.C.teal]];
    const w = 226, gap = 24, total = row.length * w + (row.length - 1) * gap;
    const x0 = (SAFE.w - total) / 2;
    V.cards = row.map((it, i) => {
      const F = this.fig(it[0]);
      return this.buildCard({
        key: 'end' + it[0], x: x0 + i * (w + gap), y: 120, w: w, h: w, vb: F.vb,
        d: this.figD(it[0]), stroke: it[1], sw: 22, fill: 'rgba(207,226,243,0.4)',
        badge: String(i + 3) + ' sides',
        anim: 'pop 2600ms ease-in-out ' + (i * 160) + 'ms infinite'
      });
    });
    V.callouts = [{
      text: 'Polygon: closed + only straight line segments',
      style: {
        position: 'absolute', left: '50%', top: '470px', translate: '-50% 0',
        padding: '16px 54px', borderRadius: '34px', background: '#fff8e2', border: '5px solid ' + GOLD,
        font: '800 42px "Baloo 2", Nunito, sans-serif', color: '#8a5a12', whiteSpace: 'nowrap',
        boxShadow: '0 8px 0 rgba(198,146,44,0.35)', animation: 'pop 620ms ease-out both'
      }
    }];
    V.targets = [{
      text: 'Play again', click: this.restart, nudge: '',
      style: Object.assign({
        position: 'absolute', left: '50%', top: '620px', translate: '-50% 0', zIndex: 8
      }, this.bigBtn(GRN, 300))
    }];
  }
}
