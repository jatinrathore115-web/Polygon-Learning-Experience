<!doctype html><style>
  html, body { margin: 0; padding: 0; height: 100%; background: #8b7edc; overflow: hidden; }
  a { color: #2f6fd0; } a:hover { color: #1546a0; }
  /* The lesson has no text-entry fields: suppress selection and browsing carets. */
  * { -webkit-tap-highlight-color: transparent; caret-color: transparent; -webkit-user-select: none; user-select: none; }
  body { cursor: default; }
  @keyframes magicReveal {
    0% { opacity:0; transform:scale(.86) translateY(12px); filter:blur(7px) drop-shadow(0 0 18px #ffc65a); }
    58% { opacity:1; transform:scale(1.025) translateY(-2px); filter:blur(0) drop-shadow(0 0 9px rgba(255,180,55,.6)); }
    100% { opacity:1; transform:scale(1); filter:none; }
  }
  @keyframes magicSpark {
    0% { opacity:0; transform:translate(0,0) scale(.1) rotate(0deg); }
    30% { opacity:.9; }
    100% { opacity:0; transform:translate(var(--mx),var(--my)) scale(.25) rotate(100deg); }
  }
  @media (prefers-reduced-motion:reduce) { .magic-spark { display:none; } }
  @keyframes confettiFall {
    0% { transform:translate3d(0,0,0) rotate(0deg) rotateY(0deg); opacity:1; }
    10% { opacity:1; }
    75% { opacity:1; }
    100% { transform:translate3d(var(--drift),calc(100vh + 100px),0) rotate(var(--spin)) rotateY(540deg); opacity:0; }
  }
  @media (prefers-reduced-motion:reduce) { .celebration-piece { animation:none !important; display:none; } }
  @keyframes shapeFinish {
    0% { stroke:#74e8ff; fill:rgba(75,210,245,.02); filter:drop-shadow(0 0 16px rgba(34,184,230,.65)); }
    45% { stroke:#2cbce7; fill:rgba(75,210,245,.12); filter:drop-shadow(0 0 12px rgba(34,184,230,.45)); }
    100% { stroke:#1aa7d5; fill:rgba(75,210,245,.045); filter:drop-shadow(0 0 7px rgba(34,184,230,.28)); }
  }
  @media (prefers-reduced-motion:reduce) { .created-shape { animation:none !important; } }
  @keyframes cueFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes dr { to { stroke-dashoffset: 0; } }
  @keyframes sideStep { 0% { stroke-dashoffset:100; opacity:1; } 45% { stroke-dashoffset:0; opacity:1; } 80% { stroke-dashoffset:0; opacity:1; } 100% { stroke-dashoffset:0; opacity:0; } }
  @keyframes breathe { 0%,100% { transform: scale(1) translateY(0); } 50% { transform: scale(1.014) translateY(-3px); } }
  @keyframes sway { 0%,100% { transform: rotate(-1.1deg) translateY(0); } 50% { transform: rotate(1.4deg) translateY(-4px); } }
  @keyframes nod { 0% { transform: translateY(0) scale(1); } 35% { transform: translateY(-16px) scale(1.04); } 60% { transform: translateY(2px) scale(0.99); } 100% { transform: translateY(0); } }
  @keyframes tilt { 0%,100% { transform: rotate(0); } 30% { transform: rotate(-7deg); } 70% { transform: rotate(4deg); } }
  @keyframes wig { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-11px); } 45% { transform: translateX(9px); } 70% { transform: translateX(-6px); } }
  @keyframes wrongTapA { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 45% { transform: translateX(5px); } 70% { transform: translateX(-3px); } }
  @keyframes wrongTapB { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 45% { transform: translateX(5px); } 70% { transform: translateX(-3px); } }
  @keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.09); } 100% { transform: scale(1); } }
  @keyframes ptPulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.18); opacity: 0.86; } }
  @keyframes halo { 0% { transform: scale(0.7); opacity: 0.55; } 100% { transform: scale(2.1); opacity: 0; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes handHint { 0%,100% { transform: translate(0,0); opacity: 0.9; } 50% { transform: translate(64px,-52px); opacity: 1; } }
  @keyframes nudgeTap { 0% { transform: translate(14px,30px) scale(1.1); opacity: 0; } 16% { transform: translate(0,0) scale(1.06); opacity: 1; } 38% { transform: translate(0,0) scale(0.84); } 56% { transform: translate(0,0) scale(1.04); } 82% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(0,6px) scale(1); opacity: 0; } }
  @keyframes nudgeRing { 0% { transform: scale(0.3); opacity: 0; } 34% { transform: scale(0.4); opacity: 0.85; } 100% { transform: scale(1.7); opacity: 0; } }
  @keyframes glowPulse { 0%,100% { opacity: 0.25; } 50% { opacity: 0.75; } }
  @keyframes zoneInvite { 0%,100% { box-shadow: 0 0 0 0 rgba(34,184,230,0); } 50% { box-shadow: 0 0 0 9px rgba(34,184,230,0.17); } }
  /* --- MammothGuide poses. Every keyframe animates transform only, inside a
         fixed-size viewport, so the character's anchor and scale never move. --- */
  @keyframes mamRise { 0% { transform: translateY(232px); } 72% { transform: translateY(-6px); } 100% { transform: translateY(0); } }
  @keyframes mamBreathe { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-2px) scale(1.006); } }
  @keyframes mamTalk { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes mamWatch { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-2px) scale(1.004); } }
  @keyframes mamCurious { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes mamThink { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-2px) scale(1.005); } }
  @keyframes mamNod { 0% { transform: translateY(0); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0); } }
  @keyframes mamSuccessA { 0% { transform: translateY(0) scale(1); } 40% { transform: translateY(-16px) scale(1.02); } 100% { transform: translateY(0); } }
  @keyframes mamSuccessB { 0% { transform: translateY(0) scale(1); } 40% { transform: translateY(-16px) scale(1.02); } 100% { transform: translateY(0); } }
  @keyframes mamCelebrate { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-14px) scale(1.015); } }
  @keyframes mamSurpriseA { 0% { transform: scale(1); } 35% { transform: translateY(-8px) scale(1.035); } 100% { transform: translateY(0); } }
  @keyframes mamSurpriseB { 0% { transform: scale(1); } 35% { transform: translateY(-8px) scale(1.035); } 100% { transform: translateY(0); } }
  @keyframes mamOopsA { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(6px) scale(0.99); } }
  @keyframes mamOopsB { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(6px) scale(0.99); } }
  /* --- ambient + interaction juice --- */
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes snowFall { 0% { transform: translateY(-70px); } 100% { transform: translateY(1180px); } }
  @keyframes flakeSway { 0%,100% { transform: translateX(-14px); } 50% { transform: translateX(14px); } }
  @keyframes ripple { 0% { transform: scale(0.18); opacity: 0.9; } 100% { transform: scale(2.5); opacity: 0; } }
  @keyframes instructionPanelIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
  .instruction-panel { position:absolute; inset:0; z-index:40; pointer-events:none; animation:instructionPanelIn 420ms ease-in both; }
  @keyframes textIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes textInB { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  /* Interactive affordances live on separate layers so feedback animations keep their transforms. */
  @keyframes actionGlow { 0%,100% { opacity:.35; } 50% { opacity:.85; } }
  @keyframes actionShine { 0%,65% { background-position:180% 0; } 100% { background-position:-80% 0; } }
  .game-action { position:relative; isolation:isolate; touch-action:manipulation; transition:scale 140ms ease; }
  .game-action::before { content:''; position:absolute; inset:-4px; border-radius:inherit; pointer-events:none; opacity:0; box-shadow:0 0 0 2px rgba(80,205,255,.4),0 0 22px rgba(35,181,255,.4); transition:opacity 180ms; }
  [data-interactive="true"] .game-action::before { animation:actionGlow 3.2s ease-in-out infinite; }
  [data-interactive="true"] .game-action:hover::before,
  [data-interactive="true"] .game-action:focus-visible::before { animation:none; opacity:1; box-shadow:0 0 0 3px #a3edff,0 0 32px rgba(20,172,255,.65); }
  [data-interactive="true"] .game-action:active { scale:.96; }
  .game-action:focus-visible { outline:4px solid #f5c33f; outline-offset:7px; }
  .game-primary::after { content:''; position:absolute; inset:7px; border-radius:inherit; pointer-events:none; background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 49%,transparent 63%) 180% 0 / 250% 100% no-repeat; opacity:0; }
  [data-interactive="true"] .game-primary::after { opacity:1; animation:actionShine 4.5s ease-in-out infinite; }
  [data-interactive="true"] .game-handle { filter:drop-shadow(0 0 9px #22b8e6); }
  /* Quiet controls: no pulsing halo, no shine sweep — a crisp lift on hover, so
     they still answer the pointer without glowing like a primary button. */
  .game-quiet { transition:translate 140ms ease, border-color 140ms ease, box-shadow 140ms ease; }
  .game-quiet::before, .game-quiet::after { display:none !important; }
  [data-interactive="true"] .game-quiet:hover { translate:0 -2px; border-color:#7cc9f2; }
  [data-interactive="true"] .game-quiet:active { translate:0 1px; }
  @media (prefers-reduced-motion:reduce) {
    .idle-hand,.idle-ring { animation:none !important; transform:none !important; opacity:1 !important; }
    .instruction-panel { animation:none !important; }
    .drop-zone { animation:none !important; }
    .ice-board { transition:none !important; }
    .narrator-text span { animation:none !important; opacity:1 !important; transform:none !important; }
    .game-action,.game-action::before,.game-action::after,.game-action *,.game-handle { animation:none !important; transition:none !important; }
    [data-interactive="true"] .game-action::before { opacity:.55; }
    .game-primary::after { display:none; }
  }
</style><div class="narrator-text"><span style="display:inline-block;color:#633c19;opacity:0;transform-origin:50% 70%;animation:textIn 220ms ease-in 0ms both;animation-play-state:running">One</span><span style="white-space:pre"> </span><span style="display:inline-block;color:#633c19;opacity:0;transform-origin:50% 70%;animation:textIn 220ms ease-in 110ms both;animation-play-state:running">two</span><span style="white-space:pre"> </span><span style="display:inline-block;color:#633c19;opacity:0;transform-origin:50% 70%;animation:textIn 220ms ease-in 220ms both;animation-play-state:running">three</span><span style="white-space:pre"> </span><span style="display:inline-block;color:#633c19;opacity:0;transform-origin:50% 70%;animation:textIn 220ms ease-in 330ms both;animation-play-state:running">four</span><span style="white-space:pre"> </span><span style="display:inline-block;color:#633c19;opacity:0;transform-origin:50% 70%;animation:textIn 220ms ease-in 440ms both;animation-play-state:running">five.</span></div><pre id="result"></pre><script>const words=[...document.querySelectorAll(".narrator-text > span")].filter(s=>s.textContent.trim());const animations=words.map(s=>s.getAnimations()[0]);const snapshots=[0,160,1000].map(t=>{animations.forEach(a=>{a.pause();a.currentTime=t});return words.map(s=>+getComputedStyle(s).opacity)});document.getElementById("result").textContent=JSON.stringify(snapshots);</script>
