<!doctype html><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8ecff2}#stage{position:absolute;left:50%;top:50%;width:1980px;height:1080px;transform-origin:center center}</style><div id="stage"><img src="../assets/background..png" style="position:absolute;left:0.0000%;top:0.0000%;width:100.0000%;height:100.0000%;z-index:0;display:block;object-fit:cover;user-select:none;pointer-events:none"><img id="board" src="../assets/ice%20board.png" style="position:absolute;left:1.0305%;top:3.9112%;width:97.9358%;height:97.9358%;z-index:30;display:block;object-fit:fill;user-select:none;pointer-events:none"><img src="../assets/intruction%20panel.png" style="position:absolute;left:19.8990%;top:0.9259%;width:60.2525%;height:16.1111%;z-index:40;display:block;user-select:none;pointer-events:none"></div><pre id="result" style="display:none"></pre><script>onload=()=>{document.querySelector('#stage').style.transform='translate(-50%,-50%) scale('+Math.min(innerWidth/1980,innerHeight/1080)+')';const b=document.querySelector('#board'),r=b.getBoundingClientRect();document.querySelector('#result').textContent=JSON.stringify({width:innerWidth,height:innerHeight,loaded:b.naturalWidth===1980&&b.naturalHeight===1080,fit:getComputedStyle(b).objectFit,bounds:{left:r.left,top:r.top,right:r.right,bottom:r.bottom},pass:r.left>=-.01&&r.top>=-.01&&r.right<=innerWidth+.01&&r.bottom<=innerHeight+.01,noScroll:document.documentElement.scrollWidth===innerWidth});};</script>
